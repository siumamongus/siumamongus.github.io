
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Distance Chart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 900px;
            width: 100%;
            margin: 20px;
        }
        
        .chart-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .chart-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
            font-weight: 300;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea22, #764ba222);
            border-radius: 15px;
            transition: transform 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-3px);
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .chart-container {
                margin: 10px;
                padding: 20px;
            }
            
            .chart-title {
                font-size: 1.5rem;
            }
            
            .chart-wrapper {
                height: 300px;
            }
            
            .stats-summary {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <h1 class="chart-title">🚗 Total Driving Distance</h1>
        <p class="chart-subtitle">Interactive analysis of who's doing the most driving</p>
        
        <div class="chart-wrapper">
            <canvas id="distanceChart"></canvas>
        </div>
        
        <div class="stats-summary">
            <div class="stat-item">
                <div class="stat-number">503</div>
                <div class="stat-label">Total Distance - km</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">3</div>
                <div class="stat-label">Active Drivers</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">27</div>
                <div class="stat-label">Total Trips</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">18.6</div>
                <div class="stat-label">Avg per Trip - km</div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('distanceChart').getContext('2d');
        
        const data = {
            labels: ['Fra', 'Gabbo', 'Mattia'],
            datasets: [{
                label: 'Distance (km)',
                data: [145.6469027476479, 175.10084367230812, 182.71581814477395],
                backgroundColor: ['rgba(54, 162, 235, 0.8)', 'rgba(75, 192, 192, 0.8)', 'rgba(255, 206, 86, 0.8)'],
                hoverBackgroundColor: ['rgba(54, 162, 235, 1)', 'rgba(75, 192, 192, 1)', 'rgba(255, 206, 86, 1)'],
                borderColor: ['rgba(54, 162, 235, 1)', 'rgba(75, 192, 192, 1)', 'rgba(255, 206, 86, 1)'],
                borderWidth: 2,
                borderRadius: 8,
                borderSkipped: false,
            }]
        };

        const config = {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        titleColor: 'white',
                        bodyColor: 'white',
                        cornerRadius: 10,
                        displayColors: false,
                        callbacks: {
                            title: function(context) {
                                return context[0].label;
                            },
                            label: function(context) {
                                const driverIndex = context.dataIndex;
                                const trips = [np.int64(8), np.int64(9), np.int64(10)][driverIndex];
                                const distance = context.parsed.y;
                                const avgPerTrip = (distance / trips).toFixed(1);
                                return [
                                    `Total Distance: ${distance.toFixed(1)} km`,
                                    `Number of Trips: ${trips}`,
                                    `Average per Trip: ${avgPerTrip} km`
                                ];
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0,0,0,0.1)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#666',
                            font: {
                                size: 12,
                                weight: '500'
                            },
                            callback: function(value) {
                                return value + ' km';
                            }
                        },
                        title: {
                            display: true,
                            text: 'Distance (km)',
                            color: '#333',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#666',
                            font: {
                                size: 12,
                                weight: '600'
                            }
                        },
                        title: {
                            display: true,
                            text: 'Drivers',
                            color: '#333',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        }
                    }
                },
                animation: {
                    duration: 2000,
                    easing: 'easeOutQuart'
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                }
            }
        };

        // Create the chart
        const chart = new Chart(ctx, config);
        
        // Add click animation
        ctx.canvas.addEventListener('click', function(e) {
            const points = chart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
            
            if (points.length) {
                const firstPoint = points[0];
                // Add a subtle animation effect
                chart.setActiveElements(points);
                chart.update('none');
            }
        });
    </script>
</body>
</html>
